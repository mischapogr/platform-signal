apiVersion: v1
kind: Service
metadata:
  name: {{ include "signal.name" . }}
  labels:
    {{- include "signal.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "signal.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
