{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "filesystem persistence requires replicaCount=1" }}
{{- end }}
{{- if and .Values.runtime.files (not .Values.runtime.existingSecret) }}
{{- fail "runtime.files requires runtime.existingSecret" }}
{{- end }}
{{- $seen := dict }}
{{- $reserved := list "PATH" "HOME" "USER" "SHELL" "LD_PRELOAD" "LD_LIBRARY_PATH" "RUST_LOG" }}
{{- $runtimeEnv := list "SIGNAL_IDENTITY_CLIENT_SECRET" "SIGNAL_S3_ENDPOINT" "SIGNAL_S3_REGION" "SIGNAL_S3_BUCKET" "SIGNAL_S3_ACCESS_KEY" "SIGNAL_S3_SECRET_KEY" "SIGNAL_S3_SESSION_TOKEN" "SIGNAL_S3_BACKEND_ID" "SIGNAL_S3_ALLOW_LOOPBACK_HTTP" "SIGNAL_S3_OBJECT_BYTES" "SIGNAL_S3_INVENTORY_OBJECTS" "SIGNAL_S3_CACHE_FILES" "SIGNAL_S3_CACHE_BYTES" }}
{{- range .Values.runtime.secretEnv }}
{{- if hasKey $seen .name }}
{{- fail "runtime.secretEnv contains a duplicate environment name" }}
{{- end }}
{{- if has .name $reserved }}
{{- fail "runtime.secretEnv cannot override process control or logging settings" }}
{{- end }}
{{- if and (hasPrefix "SIGNAL_" .name) (not (has .name $runtimeEnv)) }}
{{- fail "runtime.secretEnv cannot override chart-owned settings or runtime config selectors" }}
{{- end }}
{{- $_ := set $seen .name true }}
{{- end }}
{{- if eq (int .Values.service.port) (int .Values.service.metricsPort) }}
{{- fail "service.port and service.metricsPort must differ" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signal.name" . }}
  labels:
    {{- include "signal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "signal.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal.selector" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: signal
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/signal/server.yaml"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: SIGNAL_HEALTHCHECK_ADDR
              value: {{ printf "127.0.0.1:%d" (int .Values.service.port) | quote }}
            {{- if .Values.tls.existingSecret }}
            - name: SIGNAL_TLS_CONFIG
              value: /etc/signal/tls/server.json
            - name: SIGNAL_PROBE_TLS_CONFIG
              value: /etc/signal/tls/probe.json
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: SIGNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.key | quote }}
            {{- end }}
            {{- range $name, $key := .Values.runtime.files }}
            - name: {{ $name }}
              value: {{ printf "/etc/signal/%s.json" $name | quote }}
            {{- end }}
            {{- if hasKey .Values.runtime.files "SIGNAL_SHARED_CONFIG" }}
            - name: SIGNAL_STORAGE_TYPE
              value: s3
            - name: SIGNAL_S3_CACHE_DIR
              value: /var/lib/signal/query-cache
            {{- end }}
            {{- range .Values.runtime.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret | quote }}
                  key: {{ .key | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/signal-agent", "--readycheck"]
            timeoutSeconds: 3
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/signal-agent", "--readycheck"]
            timeoutSeconds: 3
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/signal-agent", "--healthcheck"]
            timeoutSeconds: 3
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/signal/server.yaml, subPath: server.yaml, readOnly: true}
            - {name: data, mountPath: /var/lib/signal}
            - {name: tmp, mountPath: /tmp}
            {{- range $name, $key := .Values.runtime.files }}
            - name: runtime
              mountPath: {{ printf "/etc/signal/%s.json" $name | quote }}
              subPath: {{ printf "%s.json" $name | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - {name: tls, mountPath: /etc/signal/tls, readOnly: true}
            {{- end }}
            {{- if .Values.rules.existingConfigMap }}
            {{- range .Values.rules.keys }}
            - name: rules
              mountPath: {{ printf "/etc/signal/rules/%s" . | quote }}
              subPath: {{ . | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "signal.name" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "signal.name" .) }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if .Values.runtime.files }}
        - name: runtime
          secret:
            secretName: {{ .Values.runtime.existingSecret | quote }}
            defaultMode: 0440
            items:
              {{- range $name, $key := .Values.runtime.files }}
              - key: {{ $key | quote }}
                path: {{ printf "%s.json" $name | quote }}
              {{- end }}
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | quote }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.tls.serverKey | quote }}, path: server.json}
              - {key: {{ .Values.tls.probeKey | quote }}, path: probe.json}
        {{- end }}
        {{- if .Values.rules.existingConfigMap }}
        - name: rules
          configMap:
            name: {{ .Values.rules.existingConfigMap | quote }}
        {{- end }}
