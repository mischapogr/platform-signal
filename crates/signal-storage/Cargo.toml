[package]
name = "signal-storage"
description = "Replaceable EventStore contract and filesystem Parquet implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
s3 = ["object_store/aws", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:url"]

[dependencies]
signal-event.workspace = true
signal-protocol.workspace = true
arrow.workspace = true
bytes.workspace = true
futures.workspace = true
futures-util.workspace = true
object_store = { workspace = true, features = ["fs"] }
parquet.workspace = true
chrono.workspace = true
crc32fast.workspace = true
ring.workspace = true
futures-core.workspace = true
async-trait.workspace = true
hyper = { workspace = true, features = ["client"], optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "=1.0.9", optional = true }
url = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
