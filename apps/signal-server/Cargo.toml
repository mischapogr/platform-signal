[package]
name = "signal-server"
description = "Monolithic ingest, persistence, query and detection process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
s3-query = ["signal-storage/s3"]
aws-source = ["signal-collector-sdk/aws-source"]

[dependencies]
serde-saphyr.workspace = true
serde.workspace = true
serde_urlencoded.workspace = true
signal-event.workspace = true
signal-protocol.workspace = true
signal-ingest.workspace = true
signal-buffer.workspace = true
signal-storage.workspace = true
signal-query.workspace = true
signal-rules.workspace = true
signal-findings.workspace = true
signal-collector-sdk.workspace = true
signal-coverage.workspace = true
chrono.workspace = true
uuid.workspace = true
axum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
sha2.workspace = true
tokio-util.workspace = true

[dev-dependencies]
object_store.workspace = true
reqwest.workspace = true
flate2.workspace = true
tower.workspace = true
tempfile.workspace = true

[[bench]]
name = "harness"
path = "../../benchmarks/harness.rs"
harness = false

[[test]]
name = "foundation"
path = "../../tests/integration/foundation.rs"

[[test]]
name = "cloudtrail-delivery"
path = "../../tests/integration/cloudtrail-delivery.rs"

[[test]]
name = "coverage-server"
path = "../../tests/integration/coverage-server.rs"

[[test]]
name = "coverage-runtime"
path = "../../tests/integration/coverage-runtime.rs"

[[test]]
name = "findings-feed"
path = "../../tests/integration/findings-feed.rs"

[[test]]
name = "access-server"
path = "../../tests/integration/access-server.rs"

[[test]]
name = "transport-server"
path = "../../tests/integration/transport-server.rs"
