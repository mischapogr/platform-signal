name: Publish OSS images

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ghcr-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  SIGNAL_RELEASE_READY_TAG: ${{ vars.SIGNAL_RELEASE_READY_TAG }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Release policy regressions
        run: python3 scripts/test-release-images.py
      - id: policy
        name: Require owner-ready public release and matching workspace version
        run: python3 scripts/release-images.py preflight

  qualification:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      prepare_candidate: true

  native:
    needs: [preflight, qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: server
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: signal-release-server:qualified
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.tag }}
      - name: Build native agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: agent
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: signal-release-agent:qualified
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.tag }}
      - name: Qualify exact server runtime and persistence
        run: python3 scripts/check-container.py --image signal-release-server:qualified --expect-architecture ${{ matrix.arch }}
      - name: Qualify agent packaging
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 signal-release-agent:qualified --version
      - name: Scan server and retain SBOM
        run: python3 scripts/check-supply-chain.py --image signal-release-server:qualified --output target/release-security/server
      - name: Scan agent and retain SBOM
        run: python3 scripts/check-supply-chain.py --image signal-release-agent:qualified --output target/release-security/agent
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish only exact qualified platform images
        run: python3 scripts/release-images.py push --arch ${{ matrix.arch }}
      - name: Sign server platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.publish.outputs.server_image }}
          subject-digest: ${{ steps.publish.outputs.server_digest }}
          sbom-path: ${{ steps.publish.outputs.server_sbom }}
          push-to-registry: true
      - name: Sign agent platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.publish.outputs.agent_image }}
          subject-digest: ${{ steps.publish.outputs.agent_digest }}
          sbom-path: ${{ steps.publish.outputs.agent_sbom }}
          push-to-registry: true
      - name: Retain platform digest records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-platform-${{ matrix.arch }}
          path: target/release-images/*-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Retain security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-security-${{ matrix.arch }}
          path: target/release-security/
          if-no-files-found: warn

  index:
    needs: [preflight, native]
    strategy:
      fail-fast: false
      matrix:
        role: [server, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ghcr-platform-*
          merge-multiple: true
          path: target/release-images
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: merge
        name: Assemble exact qualified AMD64 and ARM64 manifests
        run: python3 scripts/release-images.py merge --role ${{ matrix.role }}
      - name: Sign multi-platform build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.merge.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      - name: Require public anonymous pull by digest
        env:
          IMAGE: ${{ steps.merge.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-ghcr"
          printf '{}\n' > "$RUNNER_TEMP/anonymous-ghcr/config.json"
          docker --config "$RUNNER_TEMP/anonymous-ghcr" manifest inspect "$IMAGE@$DIGEST" > "$RUNNER_TEMP/public-manifest.json"
      - name: Retain signed public index identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-index-${{ matrix.role }}
          path: target/release-images/${{ matrix.role }}-index.json
          if-no-files-found: error

  latest:
    needs: [preflight, index]
    if: github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ghcr-index-*
          merge-multiple: true
          path: target/release-images
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both signed public stable indexes by digest
        run: python3 scripts/release-images.py promote
