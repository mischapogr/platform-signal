name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        # The agent integration test also starts the sibling server executable.
        # Build normal binaries explicitly rather than depending on test order.
        run: |
          cargo build --workspace --all-features --locked
          cargo test --workspace --all-features --locked
      - name: Workspace boundaries
        run: python3 scripts/check-workspace.py
      - name: Health probe and owned-process cleanup regressions
        run: |
          rustfmt --check --edition 2024 deploy/docker/healthcheck.rs
          rustc --edition=2024 -D warnings --test deploy/docker/healthcheck.rs -o target/signal-healthcheck-tests
          target/signal-healthcheck-tests
          python3 scripts/test-kubernetes-gate.py
          python3 scripts/test-hardening.py
          python3 scripts/test-native-qualification.py
          python3 scripts/test-soak.py
          python3 scripts/test-local-candidate.py
          python3 scripts/check-log-samples.py --self-test
      - name: Benchmark harness smoke
        run: cargo bench -p signal-server --bench harness --locked
      - name: Install pinned Kubernetes tools
        run: python3 scripts/install-kubernetes-tools.py
      - name: Helm lint and rendering
        run: |
          target/kubernetes-tools/helm lint --strict deploy/helm/signal
          target/kubernetes-tools/helm lint --strict deploy/helm/signal --set pdb.enabled=true,serviceMonitor.enabled=true
          target/kubernetes-tools/helm template proof deploy/helm/signal > target/signal-rendered.yaml
          target/kubernetes-tools/helm template proof deploy/helm/signal --set pdb.enabled=true,serviceMonitor.enabled=true > target/signal-optional-rendered.yaml
      - name: Build production container
        run: docker build -f deploy/docker/Dockerfile -t platform-signal:phase8 .
      - name: Native container runtime and persistence
        run: python3 scripts/check-container.py --image platform-signal:phase8 --expect-architecture ${{ matrix.arch }}
      - name: Native parser campaign and measured release pipeline
        run: python3 scripts/check-native-qualification.py --image platform-signal:phase8 --expect-architecture ${{ matrix.arch }} --soak-seconds 120
      - name: Kubernetes persistence and restart
        run: python3 scripts/check-kubernetes.py --image platform-signal:phase8 --helm target/kubernetes-tools/helm --kind target/kubernetes-tools/kind --kubectl target/kubernetes-tools/kubectl
      - name: Dependency audit, Cargo and image SBOMs, container vulnerability scan
        run: python3 scripts/check-supply-chain.py --image platform-signal:phase8
      - name: Preserve qualification reports and local artifact digests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ matrix.arch }}
          path: |
            target/supply-chain/reports/
            target/native-qualification/
          retention-days: 14
          if-no-files-found: error

  tooling:
    name: MCP tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked MCP tooling
        run: npm ci --prefix tools/mcp --ignore-scripts --no-fund
      - name: Launcher syntax
        run: bash -n scripts/ai/context7
      - name: Local MCP handshake and tool discovery
        run: python3 scripts/ai/check-mcp.py
